
name: Update Google Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Trends Indonesia
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://trends.google.com/trending/rss?geo=ID"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              root = ET.fromstring(response.read())

          ns = {
              "ht": "https://trends.google.com/trending/rss"
          }

          trends = []

          for item in root.findall("./channel/item"):
              title = item.findtext("title", "").strip()
              traffic = item.findtext(
                  "ht:approx_traffic", "", ns
              )
              link = item.findtext("link", "")

              if title:
                  trends.append({
                      "title": title,
                      "traffic": traffic,
                      "link": link
                  })

          if not trends:
              raise RuntimeError(
                  "Google Trends returned no data"
              )

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "total_trends": len(trends),
              "trends": trends
          }

          with open(
              "data/trends.json", "w", encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Successfully collected {len(trends)} trends"
          )
          PY

      - name: Commit updated trends
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trends.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Google Trends"
            git push
          else
            echo "No changes detected"
          fi
