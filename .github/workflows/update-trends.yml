
name: Update Google Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trendradar-deployment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Trends Indonesia
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://trends.google.com/trending/rss?geo=ID"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  root = ET.fromstring(response.read())

              ns = {
                  "ht": "https://trends.google.com/trending/rss"
              }
              trends = []

              for item in root.findall("./channel/item"):
                  title = item.findtext("title", "").strip()

                  if title:
                      trends.append({
                          "title": title,
                          "traffic": item.findtext(
                              "ht:approx_traffic", "", ns
                          ),
                          "link": item.findtext("link", "")
                      })

              if not trends:
                  raise ValueError("Feed kosong")

              output = {
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "total_trends": len(trends),
                  "trends": trends
              }

              Path("data/trends.json").write_text(
                  json.dumps(
                      output, ensure_ascii=False, indent=2
                  ),
                  encoding="utf-8"
              )

              print(f"Berhasil: {len(trends)} tren")

          except Exception as error:
              print(f"Gagal mengambil data baru: {error}")

              if not Path("data/trends.json").exists():
                  raise

              print("Menggunakan data terakhir yang tersedia")
          PY

      - name: Save data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Google Trends"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publish website
        uses: actions/deploy-pages@v4
