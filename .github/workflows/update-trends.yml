
name: Update Google Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trendradar-deployment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Trends Indonesia
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://trends.google.com/trending/rss?geo=ID"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  root = ET.fromstring(response.read())

              ns = {
                  "ht": "https://trends.google.com/trending/rss"
              }
              trends = []

              for item in root.findall("./channel/item"):
                  title = item.findtext("title", "").strip()

                  if title:
                      trends.append({
                          "title": title,
                          "traffic": item.findtext(
                              "ht:approx_traffic", "", ns
                          ),
                          "link": item.findtext("link", "")
                      })

              if not trends:
                  raise ValueError("Feed kosong")

              output = {
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "total_trends": len(trends),
                  "trends": trends
              }

              Path("data/trends.json").write_text(
                  json.dumps(
                      output, ensure_ascii=False, indent=2
                  ),
                  encoding="utf-8"
              )

              print(f"Berhasil: {len(trends)} tren")

          except Exception as error:
              print(f"Gagal mengambil data baru: {error}")

              if not Path("data/trends.json").exists():
                  raise

              print("Menggunakan data terakhir yang tersedia")
          PY

      - name: Fetch Indonesia News
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          params = urllib.parse.urlencode({
              "query": (
                  "(Indonesia OR Jakarta OR pemerintah "
                  "OR ekonomi OR teknologi) "
                  "sourcelang:indonesian"
              ),
              "mode": "artlist",
              "format": "json",
              "timespan": "24h",
              "sort": "datedesc",
              "maxrecords": 100
          })

          url = (
              "https://api.gdeltproject.org/api/v2/doc/doc?"
              + params
          )

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "TrendRadar/1.0"}
              )

              with urllib.request.urlopen(
                  request, timeout=45
              ) as response:
                  result = json.load(response)

              articles = []
              seen = set()

              for item in result.get("articles", []):
                  link = item.get("url", "")
                  title = item.get("title", "")

                  if not link or not title or link in seen:
                      continue

                  seen.add(link)

                  articles.append({
                      "title": title,
                      "url": link,
                      "source": item.get("domain", ""),
                      "published": item.get("seendate", ""),
                      "language": item.get("language", "")
                  })

              if not articles:
                  raise ValueError("Tidak ada artikel ditemukan")

              output = {
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "total_news": len(articles),
                  "articles": articles
              }

              Path("data/news.json").write_text(
                  json.dumps(
                      output, ensure_ascii=False, indent=2
                  ),
                  encoding="utf-8"
              )

              print(f"Berhasil mengambil {len(articles)} berita")

          except Exception as error:
              print(f"GDELT gagal: {error}")
              print("Data lama dipertahankan jika tersedia")
          PY

      - name: Fetch News Categories
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone

          categories = {
              "Politik": (
                  "(DPR OR presiden OR pemerintah "
                  "OR pemilu) sourcelang:indonesian"
              ),
              "Ekonomi": (
                  "(ekonomi OR inflasi OR rupiah "
                  "OR investasi) sourcelang:indonesian"
              ),
              "Teknologi": (
                  "(teknologi OR kecerdasan buatan "
                  "OR digital) sourcelang:indonesian"
              ),
              "Olahraga": (
                  "(sepakbola OR badminton OR liga "
                  "OR olahraga) sourcelang:indonesian"
              ),
              "Entertainment": (
                  "(film OR musik OR selebriti "
                  "OR konser) sourcelang:indonesian"
              )
          }

          path = Path("data/categories.json")
          previous = {}

          if path.exists():
              try:
                  previous = json.loads(
                      path.read_text(encoding="utf-8")
                  ).get("categories", {})
              except (OSError, ValueError):
                  pass

          results = {}
          successful = 0

          for name, query in categories.items():
              params = urllib.parse.urlencode({
                  "query": query,
                  "mode": "artlist",
                  "format": "json",
                  "timespan": "24h",
                  "sort": "datedesc",
                  "maxrecords": 30
              })

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + params
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "TrendRadar/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=45
                  ) as response:
                      data = json.load(response)

                  articles = []
                  seen = set()

                  for item in data.get("articles", []):
                      title = item.get("title", "")
                      link = item.get("url", "")

                      if not title or not link or link in seen:
                          continue

                      seen.add(link)

                      articles.append({
                          "title": title,
                          "url": link,
                          "source": item.get("domain", ""),
                          "published": item.get("seendate", ""),
                          "category": name
                      })

                  results[name] = articles
                  successful += 1
                  print(name, len(articles), "articles")

              except Exception as error:
                  print(name, "failed:", error)
                  results[name] = previous.get(name, [])

              time.sleep(2)

          if successful == 0 and not path.exists():
              raise RuntimeError("No category data available")

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "categories": results
          }

          if successful:
              path.write_text(
                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )
          PY

      - name: Save data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/news.json data/categories.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Google Trends"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publish website
        uses: actions/deploy-pages@v4
