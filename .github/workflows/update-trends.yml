
name: Update Google Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trendradar-deployment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Trends Indonesia
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://trends.google.com/trending/rss?geo=ID"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  root = ET.fromstring(response.read())

              ns = {
                  "ht": "https://trends.google.com/trending/rss"
              }
              trends = []


            
              for item in root.findall("./channel/item"):
                  title = item.findtext("title", "").strip()

                  if not title:
                      continue

                  related_news = []
                  seen_urls = set()

                  for news in item.findall("ht:news_item", ns):
                      news_title = news.findtext(
                          "ht:news_item_title", "", ns
                      ).strip()

                      news_url = news.findtext(
                          "ht:news_item_url", "", ns
                      ).strip()

                      news_source = news.findtext(
                          "ht:news_item_source", "", ns
                      ).strip()

                      if (
                          news_title
                          and news_url.startswith("https://")
                          and news_url not in seen_urls
                      ):
                          seen_urls.add(news_url)

                          related_news.append({
                              "title": news_title,
                              "url": news_url,
                              "source": news_source
                          })

                  trends.append({
                      "title": title,
                      "published": item.findtext("pubDate", ""),
                      "traffic": item.findtext(
                          "ht:approx_traffic", "", ns
                      ),
                      "link": item.findtext("link", ""),
                      "related_news": related_news
                  })


              if not trends:
                  raise ValueError("Feed kosong")

              output = {
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "total_trends": len(trends),
                  "trends": trends
              }

              Path("data/trends.json").write_text(
                  json.dumps(
                      output, ensure_ascii=False, indent=2
                  ),
                  encoding="utf-8"
              )

              print(f"Berhasil: {len(trends)} tren")

          except Exception as error:
              print(f"Gagal mengambil data baru: {error}")

              if not Path("data/trends.json").exists():
                  raise

              print("Menggunakan data terakhir yang tersedia")
          PY

      

      - name: Fetch Indonesia News
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          path = Path("data/news.json")
          now = datetime.now(timezone.utc)

          query = (
              "(Indonesia OR Jakarta OR ekonomi OR "
              "politik OR teknologi OR olahraga OR hiburan) "
              "sourcelang:indonesian"
          )

          def parse_seen(value):
              try:
                  return datetime.strptime(
                      value, "%Y%m%dT%H%M%SZ"
                  ).replace(tzinfo=timezone.utc)
              except (ValueError, TypeError):
                  return None

          def fetch_news(hours):
              params = urllib.parse.urlencode({
                  "query": query,
                  "mode": "artlist",
                  "format": "json",
                  "timespan": f"{hours}h",
                  "sort": "datedesc",
                  "maxrecords": 100
              })

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=45
              ) as response:
                  data = json.load(response)

              seen = set()
              articles = []

              for item in data.get("articles", []):
                  title = str(item.get("title") or "").strip()
                  link = str(item.get("url") or "").strip()
                  date = parse_seen(item.get("seendate"))

                  if not title or not link or not date:
                      continue

                  if not link.startswith("https://"):
                      continue

                  age = (now - date).total_seconds()

                  if age < 0 or age > hours * 3600:
                      continue

                  if link in seen:
                      continue

                  seen.add(link)

                  articles.append({
                      "title": title,
                      "url": link,
                      "source": item.get("domain", ""),
                      "published": item.get("seendate", ""),
                      "language": item.get("language", "")
                  })

              articles.sort(
                  key=lambda a: a["published"],
                  reverse=True
              )

              return articles

          articles = []
          selected_window = None
          errors = []

          for hours in (3, 24):
              for attempt in range(1, 3):
                  try:
                      result = fetch_news(hours)
                      print(
                          f"Window {hours}h: "
                          f"{len(result)} articles"
                      )

                      if result:
                          articles = result
                          selected_window = hours
                          break

                      break

                  except Exception as error:
                      msg = (
                          f"{hours}h attempt {attempt}: "
                          f"{type(error).__name__}: {error}"
                      )
                      errors.append(msg)
                      print(msg)

                      if attempt < 2:
                          time.sleep(15)

              if articles:
                  break

          if articles:
              newest = parse_seen(
                  articles[0]["published"]
              )

              output = {
                  "updated_at": now.isoformat(),
                  "fetched_at": now.isoformat(),
                  "latest_seen_at": newest.isoformat(),
                  "search_window_hours": selected_window,
                  "total_news": len(articles),
                  "articles": articles
              }

              path.write_text(
                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print(
                  f"Saved {len(articles)} articles. "
                  f"Latest seen: {newest.isoformat()}"
              )

          elif path.exists():
              print(
                  "::warning::No new GDELT response. "
                  "Keeping previous dataset."
              )
              for error in errors:
                  print(error)

          else:
              raise RuntimeError(
                  "GDELT unavailable and no saved data"
              )
          PY

      - name: Fetch News Categories
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import time
          import re
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone

          categories = {
              "Politik": (
                  "(DPR OR presiden OR pemerintah "
                  "OR pemilu) sourcelang:indonesian"
              ),
              "Ekonomi": (
                  "(ekonomi OR inflasi OR rupiah "
                  "OR investasi) sourcelang:indonesian"
              ),
              "Teknologi": (
                  "(teknologi OR kecerdasan buatan "
                  "OR digital) sourcelang:indonesian"
              ),
              "Olahraga": (
                  "(sepakbola OR badminton OR liga "
                  "OR olahraga) sourcelang:indonesian"
              ),
              "Entertainment": (
                  "(film OR musik OR selebriti "
                  "OR konser) sourcelang:indonesian"
              )
          }

          path = Path("data/categories.json")
          previous = {}

          if path.exists():
              try:
                  previous = json.loads(
                      path.read_text(encoding="utf-8")
                  ).get("categories", {})
              except (OSError, ValueError):
                  pass

          results = {}
          successful = 0

          for name, query in categories.items():
              params = urllib.parse.urlencode({
                  "query": query,
                  "mode": "artlist",
                  "format": "json",
                  "timespan": "24h",
                  "sort": "datedesc",
                  "maxrecords": 30
              })

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + params
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "TrendRadar/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=45
                  ) as response:
                      data = json.load(response)

                  articles = []
                  seen = set()

          
                  rules = {
                      "Politik": r"\b(DPR|DPRD|presiden|menteri|pemilu|pilkada|partai politik|parlemen|RUU)\b",
                      "Ekonomi": r"\b(ekonomi|inflasi|rupiah|saham|IHSG|investasi|perbankan|ekspor|impor|bisnis|pajak)\b",
                      "Teknologi": r"\b(teknologi|AI|kecerdasan buatan|smartphone|aplikasi|internet|siber|software|gadget|5G|robot)\b",
                      "Olahraga": r"\b(sepak bola|sepakbola|liga|pertandingan|turnamen|atlet|badminton|bulu tangkis|FIFA|timnas|gol|piala dunia)\b",
                      "Entertainment": r"\b(film|bioskop|musik|konser|penyanyi|aktor|aktris|selebriti|album|drama|artis)\b"
                  }

                  for item in data.get("articles", []):
                      title = item.get("title", "")
                      link = item.get("url", "")

                      if not title or not link or link in seen:
                          continue

                      if not re.search(
                          rules[name], title, re.IGNORECASE
                      ):
                          continue

                      seen.add(link)

                      articles.append({
                          "title": title,
                          "url": link,
                          "source": item.get("domain", ""),
                          "published": item.get("seendate", ""),
                          "category": name
                      })


                  results[name] = articles
                  successful += 1
                  print(name, len(articles), "articles")

              except Exception as error:
                  print(name, "failed:", error)
                  results[name] = previous.get(name, [])

              time.sleep(2)

          if successful == 0 and not path.exists():
              raise RuntimeError("No category data available")

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "categories": results
          }

          if successful:
              path.write_text(
                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )
          PY

 
      - name: Save Trend Analytics History
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          path = Path("data/history.json")
          trends_path = Path("data/trends.json")
          news_path = Path("data/news.json")

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=7)

          if not trends_path.exists():
              raise RuntimeError("Trends data missing")

          trends = json.loads(
              trends_path.read_text(encoding="utf-8")
          )

          if not trends.get("trends"):
              raise RuntimeError("No trends available")

          history = []

          if path.exists():
              try:
                  existing = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  history = existing.get("snapshots", [])
              except (ValueError, OSError):
                  print("History invalid, starting new history")

          news_count = None
          if news_path.exists():
              news = json.loads(
                  news_path.read_text(encoding="utf-8")
              )
              news_count = len(news.get("articles", []))

          snapshot = {
              "timestamp": now.isoformat(),
              "trends_updated_at": trends.get("updated_at"),
              "total_trends": len(trends["trends"]),
              "news_count": news_count,
              "topics": [
                  {
                      "title": item.get("title", ""),
                      "traffic": item.get("traffic", "")
                  }
                  for item in trends["trends"]
              ]
          }

          history.append(snapshot)

          filtered = []

          for item in history:
              try:
                  timestamp = datetime.fromisoformat(
                      item["timestamp"].replace("Z", "+00:00")
                  )
                  if timestamp >= cutoff:
                      filtered.append(item)
              except (KeyError, ValueError, TypeError):
                  continue

          output = {
              "retention_days": 7,
              "snapshots": filtered
          }

          path.parent.mkdir(exist_ok=True)

          path.write_text(
              json.dumps(
                  output, ensure_ascii=False, indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"History saved: {len(filtered)} snapshots"
          )
          PY

      - name: Save data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trends.json data/news.json data/categories.json data/history.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update TrendRadar data"

            for attempt in 1 2 3; do
              git fetch origin main

              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Data saved successfully"
                  break
                fi
              else
                git rebase --abort || true
                echo "Rebase conflict; stopping to protect data"
                exit 1
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push after 3 attempts"
                exit 1
              fi

              sleep 5
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publish website
        uses: actions/deploy-pages@v4
